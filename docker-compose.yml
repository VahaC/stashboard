services:
  app:
    # Pull the published image from Docker Hub. Pin a version with STASHBOARD_TAG
    # in .env (e.g. STASHBOARD_TAG=6.15.1); defaults to the latest release.
    # If your Docker Hub namespace differs, change "vahac" here.
    # To build from source instead, see docker-compose.build.yml.
    image: vahac/stashboard:${STASHBOARD_TAG:-latest}
    container_name: stashboard-app
    restart: unless-stopped
    # .env is OPTIONAL. Compose loads it when present (to override the port, pin a
    # STASHBOARD_TAG, or pass your own SMTP creds / keys) and silently skips it when
    # absent. With no .env, the defaults below apply and the encryption key + JWT
    # secret are auto-generated on first run — so `docker compose up -d` works with
    # zero configuration. (required:false needs Docker Compose v2.24+.)
    env_file:
      - path: .env
        required: false
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # SQLite database file lives on the named volume mounted at /app/Data.
      # The app applies pending migrations on startup — no separate migrator.
      STASHBOARD_ConnectionStrings__DefaultConnection: "Data Source=/app/Data/app.db"
      # Encryption key + JWT secret are OPTIONAL. Leave them blank in .env and the
      # app generates strong random values on first start and persists them under
      # /app/Data/.secrets on the stashboard-data volume — so they're preserved
      # across image updates and never overwritten. Set them explicitly only if you
      # manage secrets yourself or are migrating an existing deployment (an explicit
      # value always wins and disables auto-generation for that secret).
      STASHBOARD_Encryption__Key: ${STASHBOARD_ENCRYPTION_KEY:-}
      STASHBOARD_Jwt__Secret: ${STASHBOARD_JWT_SECRET:-}
    ports:
      - "${STASHBOARD_PORT:-8080}:8080"
    volumes:
      - stashboard-data:/app/Data
      - stashboard-uploads:/app/wwwroot/uploads


      # ─── Docker container update tracking (optional) ─────────────────────
      # Uncomment to let Stashboard inspect containers on THIS host for the
      # "Docker container" tab on each service. Read-only mount (:ro) is
      # sufficient for digest tracking + email/Telegram notifications —
      # the app only inspects under :ro.
      #
      # To also enable the V2.7 "Update now" button (pull + recreate the
      # container in place from the UI), drop the `:ro` so Stashboard can
      # call StopContainer / RemoveContainer / CreateContainer /
      # StartContainer. Every click of the button is wrapped in a
      # per-click confirmation and writes an audit row regardless of
      # outcome — see DOCKER_UPDATE_MONITORING_GUIDE.md §5.1.
      #
      # Security: anyone with the socket effectively has root on the
      # host. Don't expose the Stashboard UI publicly without a strong
      # reverse-proxy auth layer.
      # See DOCKER_UPDATE_MONITORING_GUIDE.md for full setup + remote
      # TCP+TLS / SSH alternatives if your containers run on a different
      # host.
      # - /var/run/docker.sock:/var/run/docker.sock:ro    # tracking only (V1..V2.6)
      # - /var/run/docker.sock:/var/run/docker.sock       # tracking + Update now (V2.7)
      #
      # ─── V5.2 Compose-aware "Update now" (optional) ──────────────────────
      # Bind-mount each LocalSocket host's Compose project directory so the
      # bundled `docker compose` CLI can run `pull` + `up -d` for the recreate
      # — preserving env_file resolution, depends_on ordering and profiles that
      # the raw recreate can't. Then set the connection's "Compose project path"
      # to the IN-CONTAINER path below. Read-only is enough. Local socket only;
      # remote (TCP/SSH) connections stay on the raw recreate.
      # - /srv/my-stack:/compose-projects/home-server:ro

volumes:
  stashboard-data:
  stashboard-uploads:
